<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шахматка — 433 квартиры</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f6f8; color: #1f2937; padding: 20px; }

  /* ============ ЭКРАН ВХОДА ============ */
  .login-screen {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 100;
  }
  .login-card {
    background: #fff; border-radius: 20px;
    padding: 32px 28px;
    width: 100%; max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .login-card h1 {
    font-size: 22px; text-align: center; margin-bottom: 6px;
  }
  .login-card .subtitle {
    font-size: 13px; color: #6b7280; text-align: center;
    margin-bottom: 24px;
  }
  .login-card label {
    display: block; font-size: 13px; color: #4b5563;
    margin: 14px 0 6px; font-weight: 500;
  }
  .login-card select, .login-card input {
    width: 100%; padding: 12px 14px;
    border: 1px solid #d1d5db; border-radius: 10px;
    font-size: 15px; font-family: inherit;
    background: #fff;
  }
  .login-card select:focus, .login-card input:focus {
    outline: none; border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
  }
  .login-card button {
    width: 100%; margin-top: 20px;
    padding: 13px; border: none; border-radius: 10px;
    background: #2563eb; color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: .15s;
  }
  .login-card button:hover { background: #1d4ed8; }
  .login-card button:disabled { background: #9ca3af; cursor: not-allowed; }
  .login-error {
    color: #dc2626; font-size: 13px;
    margin-top: 12px; text-align: center;
    min-height: 18px;
  }
  .login-hint {
    color: #9ca3af; font-size: 12px;
    text-align: center; margin-top: 16px;
  }

  /* ============ ОСНОВНОЙ КОНТЕНТ ============ */
  .app { display: none; }
  .app.visible { display: block; }

  header { max-width: 1600px; margin: 0 auto 14px;
    display: flex; flex-wrap: wrap; gap: 12px;
    align-items: center; justify-content: space-between; }
  .header-left { display: flex; flex-direction: column; gap: 2px; }
  h1 { font-size: 22px; }
  .address { font-size: 13px; color: #6b7280; font-weight: 500; }
  .stats { display: flex; gap: 16px; font-size: 14px; color: #4b5563; }
  .stats b { color: #111827; }

  .user-bar {
    max-width: 1600px; margin: 0 auto 12px;
    display: flex; flex-wrap: wrap; gap: 12px;
    align-items: center; justify-content: space-between;
    background: #fff; border-radius: 12px;
    padding: 10px 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  .user-info { font-size: 14px; color: #374151; }
  .user-info b { color: #111827; }
  .logout-btn {
    padding: 8px 16px; border: 1px solid #d1d5db;
    border-radius: 10px; background: #fff; font-size: 14px;
    cursor: pointer; transition: .15s;
  }
  .logout-btn:hover { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }

  .uk-block {
    max-width: 1600px; margin: 0 auto 16px;
    background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
    border-left: 4px solid #2563eb;
    border-radius: 12px; padding: 12px 16px;
    display: flex; flex-wrap: wrap; gap: 12px 24px;
    align-items: center;
  }
  .uk-title { font-size: 14px; font-weight: 600; color: #1e40af; }
  .uk-phone { display: flex; flex-wrap: wrap; gap: 16px; }
  .uk-phone a {
    color: #1d4ed8; text-decoration: none;
    font-weight: 500; font-size: 14px;
  }
  .uk-phone a:hover { text-decoration: underline; }

  .toolbar { max-width: 1600px; margin: 0 auto 18px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .toolbar input {
    flex: 1; min-width: 180px;
    padding: 9px 14px; border: 1px solid #d1d5db;
    border-radius: 10px; background: #fff; font-size: 14px;
  }

  .building { max-width: 1600px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 1200px) { .building { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 900px)  { .building { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px)  { .building { grid-template-columns: 1fr; } }

  .entrance { background: #fff; border-radius: 16px; padding: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .entrance h2 { font-size: 15px; text-align: center;
    margin-bottom: 4px; color: #374151; }
  .entrance .range { font-size: 11px; text-align: center;
    color: #9ca3af; margin-bottom: 10px; }
  .floors { display: flex; flex-direction: column-reverse; gap: 5px; }
  .floor { display: grid; gap: 5px; }

  .flat { border-radius: 8px; padding: 9px 4px; text-align: center;
    font-size: 12px; font-weight: 600; cursor: pointer;
    border: 2px solid transparent; transition: transform .12s, box-shadow .12s;
    user-select: none; overflow: hidden; }
  .flat:hover { transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,.15); }
  .flat small { display: block; font-weight: 400; font-size: 10px;
    opacity: .85; margin-top: 2px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }

  .empty { background: #d1fae5; color: #065f46; }
  .owner { background: #dbeafe; color: #1e40af; }
  .rent  { background: #fef3c7; color: #92400e; }
  .debt  { background: #fee2e2; color: #991b1b; }

  .legend { max-width: 1600px; margin: 20px auto 0;
    display: flex; flex-wrap: wrap; gap: 14px;
    font-size: 13px; color: #4b5563; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 14px; height: 14px; border-radius: 4px; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: center; justify-content: center;
    padding: 20px; z-index: 10; }
  .modal.open { display: flex; }
  .modal-card { background: #fff; border-radius: 16px; padding: 22px;
    width: 100%; max-width: 380px;
    box-shadow: 0 20px 40px rgba(0,0,0,.2); }
  .modal-card h3 { margin-bottom: 14px; }
  .modal-card label { display: block; font-size: 13px;
    color: #4b5563; margin: 10px 0 4px; }
  .modal-card input, .modal-card select, .modal-card textarea {
    width: 100%; padding: 9px 10px; border: 1px solid #d1d5db;
    border-radius: 8px; font-size: 14px; font-family: inherit; }
  .modal-card input:disabled, .modal-card select:disabled,
  .modal-card textarea:disabled {
    background: #f9fafb; color: #6b7280; cursor: not-allowed; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions button { flex: 1; padding: 10px;
    border-radius: 10px; border: none; font-size: 14px; cursor: pointer; }
  .btn-save { background: #2563eb; color: #fff; }
  .btn-save:hover { background: #1d4ed8; }
  .btn-cancel { background: #e5e7eb; color: #374151; }
  .btn-cancel:hover { background: #d1d5db; }

  @media (max-width: 600px) {
    .uk-block { font-size: 13px; padding: 10px 12px; }
    .uk-phone { gap: 8px; }
    h1 { font-size: 18px; }
    .address { font-size: 12px; }
  }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>🏢 Шахматка дома</h1>
    <div class="subtitle">ул. Мечтателей, 10/1</div>

    <label>Кто вы?</label>
    <select id="loginSelect">
      <option value="">— выберите —</option>
      <option value="admin">Председатель совета дома</option>
      <option value="1">Старший 1-го подъезда</option>
      <option value="2">Старший 2-го подъезда</option>
      <option value="3">Старший 3-го подъезда</option>
      <option value="4">Старший 4-го подъезда</option>
      <option value="5">Старший 5-го подъезда</option>
      <option value="6">Старший 6-го подъезда</option>
      <option value="7">Старший 7-го подъезда</option>
      <option value="8">Старший 8-го подъезда</option>
    </select>

    <label>Пароль</label>
    <input id="loginPassword" type="password" placeholder="Введите пароль" />

    <button id="loginBtn" onclick="doLogin()">Войти</button>
    <div class="login-error" id="loginError"></div>
    <div class="login-hint">Забыли пароль — обратитесь к председателю дома</div>
  </div>
</div>

<!-- ОСНОВНОЙ КОНТЕНТ -->
<div class="app" id="app">

  <div class="user-bar">
    <div class="user-info" id="userInfo"></div>
    <button class="logout-btn" onclick="doLogout()">Выйти</button>
  </div>

  <header>
    <div class="header-left">
      <h1>🏢 Шахматка — 433 квартиры</h1>
      <div class="address">ул. Мечтателей, 10/1</div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="uk-block">
    <div class="uk-title">📞 Управляющая компания</div>
    <div class="uk-phone">
      <a href="tel:+73472463763">+7 (347) 246-37-63</a>
      <a href="tel:+73472463793">+7 (347) 246-37-93</a>
    </div>
  </div>

  <div class="toolbar">
    <input id="search" placeholder="🔍 Поиск: №, ФИО, авто" />
  </div>

  <div class="building" id="building"></div>

  <div class="legend">
    <span><i class="dot empty"></i> Пустая / нет данных</span>
    <span><i class="dot owner"></i> Собственник проживает</span>
    <span><i class="dot rent"></i> Сдаётся</span>
  </div>

</div>

<!-- МОДАЛКА КВАРТИРЫ -->
<div class="modal" id="modal">
  <div class="modal-card">
    <h3 id="modalTitle">Квартира</h3>
    <label>ФИО жильца</label>
    <input id="fio" placeholder="Иванов Иван Иванович" />
    <label>Телефон</label>
    <input id="phone" placeholder="+7 900 000-00-00" />
    <label>Статус</label>
    <select id="status">
      <option value="empty">Пустая / нет данных</option>
      <option value="owner">Собственник проживает</option>
      <option value="rent">Сдаётся</option>
    </select>
    <label>Авто (номер и марка)</label>
    <input id="car" />
    <label>Заметка</label>
    <textarea id="note" rows="2"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Закрыть</button>
      <button class="btn-save" id="saveBtn" onclick="saveFlat()">Сохранить</button>
    </div>
  </div>
</div>

<script>
const FLOORS = 9;
const ENTRANCES_CONFIG = [
  { ground: 4, other: 5 },
  { ground: 5, other: 6 },
  { ground: 4, other: 5 },
  { ground: 5, other: 6 },
  { ground: 7, other: 8 },
  { ground: 4, other: 5 },
  { ground: 7, other: 8 },
  { ground: 5, other: 6 }
];

function computeEntrances() {
  let running = 1;
  return ENTRANCES_CONFIG.map((cfg, idx) => {
    const count = cfg.ground + cfg.other * (FLOORS - 1);
    const o = { number: idx + 1, start: running, end: running + count - 1,
                count, ground: cfg.ground, other: cfg.other };
    running += count;
    return o;
  });
}
const ENTRANCES = computeEntrances();
const TOTAL_FLATS = ENTRANCES[ENTRANCES.length - 1].end;

let state = {
  flats: {},
  current: null,
  user: null,
  token: null
};

/* ============ ХРАНЕНИЕ ТОКЕНА ============ */
function saveToken(token, user) {
  localStorage.setItem('authToken', token);
  localStorage.setItem('authUser', JSON.stringify(user));
  localStorage.setItem('authExpire', String(Date.now() + 7 * 24 * 60 * 60 * 1000));
}
function loadToken() {
  const token = localStorage.getItem('authToken');
  const user = localStorage.getItem('authUser');
  const expire = Number(localStorage.getItem('authExpire') || 0);
  if (!token || !user || Date.now() > expire) {
    clearToken();
    return null;
  }
  return { token, user: JSON.parse(user) };
}
function clearToken() {
  localStorage.removeItem('authToken');
  localStorage.removeItem('authUser');
  localStorage.removeItem('authExpire');
}

/* ============ ВХОД ============ */
async function doLogin() {
  const login = document.getElementById('loginSelect').value;
  const password = document.getElementById('loginPassword').value;
  const errorEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  errorEl.textContent = '';

  if (!login) { errorEl.textContent = 'Выберите, кто вы'; return; }
  if (!password) { errorEl.textContent = 'Введите пароль'; return; }

  btn.disabled = true;
  btn.textContent = 'Вход...';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login, password })
    });
    const data = await res.json();
    if (data.ok) {
      saveToken(data.token, data.user);
      state.token = data.token;
      state.user = data.user;
      showApp();
      await loadData();
    } else {
      errorEl.textContent = data.error || 'Неверный пароль';
      btn.disabled = false;
      btn.textContent = 'Войти';
    }
  } catch (e) {
    errorEl.textContent = 'Ошибка соединения';
    btn.disabled = false;
    btn.textContent = 'Войти';
  }
}

async function doLogout() {
  try { await fetch('/api/logout', { method: 'POST' }); } catch(e) {}
  clearToken();
  state.user = null;
  state.token = null;
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginSelect').value = '';
  document.getElementById('loginError').textContent = '';
  document.getElementById('loginBtn').disabled = false;
  document.getElementById('loginBtn').textContent = 'Войти';
  document.getElementById('app').classList.remove('visible');
  document.getElementById('loginScreen').style.display = 'flex';
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  const u = state.user;
  const rangeText = u.role === 'admin' ? 'все подъезды' : `подъезд №${u.entrance}`;
  document.getElementById('userInfo').innerHTML =
    `${u.name} · <b>${rangeText}</b>`;
}

/* ============ ЗАГРУЗКА ДАННЫХ ============ */
async function loadData() {
  try {
    const res = await fetch('/api/data', {
      headers: { 'X-Auth-Token': state.token }
    });
    if (res.status === 401) {
      doLogout();
      return;
    }
    const data = await res.json();
    state.flats = {};
    for (const f of data.flats) state.flats[f.number] = f;
    render();
  } catch (e) {
    console.error('Ошибка загрузки:', e);
  }
}

/* ============ ОПРЕДЕЛЕНИЕ ДОСТУПНЫХ ПОДЪЕЗДОВ ============ */
function getVisibleEntrances() {
  if (!state.user) return [];
  if (state.user.role === 'admin') return ENTRANCES;
  return ENTRANCES.filter(e => e.number === state.user.entrance);
}

/* ============ РАСЧЁТ НОМЕРА КВАРТИРЫ ============ */
function flatNumber(entranceObj, floor, pos) {
  let offset = 0;
  for (let f = 1; f < floor; f++) {
    offset += (f === 1) ? entranceObj.ground : entranceObj.other;
  }
  return entranceObj.start + offset + (pos - 1);
}

/* ============ РЕНДЕР ============ */
function render() {
  const building = document.getElementById('building');
  building.innerHTML = '';
  const query = document.getElementById('search').value.trim().toLowerCase();
  const visible = getVisibleEntrances();

  visible.forEach(entr => {
    const entrDiv = document.createElement('div');
    entrDiv.className = 'entrance';
    entrDiv.innerHTML = '<h2>Подъезд ' + entr.number + '</h2>' +
      '<div class="range">кв. ' + entr.start + '–' + entr.end + ' (' + entr.count + ')</div>';
    const floorsDiv = document.createElement('div');
    floorsDiv.className = 'floors';
    const maxOnFloor = Math.max(entr.ground, entr.other);

    for (let f = 1; f <= FLOORS; f++) {
      const countOnFloor = (f === 1) ? entr.ground : entr.other;
      const floorDiv = document.createElement('div');
      floorDiv.className = 'floor';
      floorDiv.style.gridTemplateColumns = 'repeat(' + maxOnFloor + ', 1fr)';

      for (let p = 1; p <= countOnFloor; p++) {
        const num = flatNumber(entr, f, p);
        const info = state.flats[num] || {};
        const status = info.status || 'empty';
        const fio = info.fio || '';
        const car = info.car || '';

        const matchesNum = String(num).indexOf(query) !== -1;
        const matchesFio = fio.toLowerCase().indexOf(query) !== -1;
        const matchesCar = car.toLowerCase().indexOf(query) !== -1;

        if (query && !matchesNum && !matchesFio && !matchesCar) {
          const stub = document.createElement('div');
          stub.style.visibility = 'hidden';
          floorDiv.appendChild(stub);
          continue;
        }

        const cell = document.createElement('div');
        cell.className = 'flat ' + status;
        const shortName = fio ? fio.split(' ')[0] : '';
        cell.innerHTML = num + (shortName ? '<small>' + shortName + '</small>' : '');
        cell.title = 'Кв. ' + num
          + (fio ? ' — ' + fio : '')
          + (car ? ' — 🚗 ' + car : '');
        cell.onclick = () => openModal(num);
        floorDiv.appendChild(cell);
      }
      floorsDiv.appendChild(floorDiv);
    }
    entrDiv.appendChild(floorsDiv);
    building.appendChild(entrDiv);
  });
  renderStats();
}

function renderStats() {
  const filled = Object.values(state.flats)
    .filter(v => v.status && v.status !== 'empty').length;
  const visible = getVisibleEntrances();
  const totalVisible = visible.reduce((sum, e) => sum + e.count, 0);
  document.getElementById('stats').innerHTML =
    'Всего: <b>' + totalVisible + '</b> · Заполнено: <b>' + filled + '</b>';
}

/* ============ МОДАЛКА ============ */
function openModal(num) {
  state.current = num;
  const info = state.flats[num] || {};
  document.getElementById('modalTitle').textContent = 'Квартира № ' + num;
  document.getElementById('fio').value = info.fio || '';
  document.getElementById('phone').value = info.phone || '';
  document.getElementById('status').value = info.status || 'empty';
  document.getElementById('note').value = info.note || '';
  document.getElementById('car').value = info.car || '';
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

async function saveFlat() {
  const body = {
    number: state.current,
    fio: document.getElementById('fio').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    status: document.getElementById('status').value,
    note: document.getElementById('note').value.trim(),
    car: document.getElementById('car').value.trim()
  };
  const res = await fetch('/api/flat', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Auth-Token': state.token
    },
    body: JSON.stringify(body)
  });
  if (res.ok) { await loadData(); closeModal(); }
  else if (res.status === 401) { doLogout(); }
  else alert('Ошибка сохранения');
}

/* ============ СТАРТ ============ */
document.getElementById('search').addEventListener('input', render);
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});
document.getElementById('loginPassword').addEventListener('keypress', e => {
  if (e.key === 'Enter') doLogin();
});

(async function init() {
  const saved = loadToken();
  if (saved) {
    state.token = saved.token;
    state.user = saved.user;
    // Проверим, что токен ещё валиден
    try {
      const r = await fetch('/api/me', { headers: { 'X-Auth-Token': saved.token } });
      if (r.ok) {
        showApp();
        await loadData();
        return;
      }
    } catch(e) {}
    clearToken();
  }
  // Показываем экран входа
  document.getElementById('loginScreen').style.display = 'flex';
})();
</script>
</body>
</html>
